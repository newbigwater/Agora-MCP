[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agora-mcp"
version = "0.1.0"
description = "AI Agent Multi-Hub MCP Server for Claude Code, Antigravity, and Codex"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "newbigwater", email = "newbigwater@gmail.com" }
]
keywords = ["mcp", "model-context-protocol", "ai-agents", "peer-review", "claude-code", "antigravity", "codex"]
dependencies = [
    "mcp>=1.3.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
agora-mcp = "agora_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
